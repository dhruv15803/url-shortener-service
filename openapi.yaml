openapi: 3.1.0

info:
  title: URL Shortener Service API
  version: 1.0.0
  description: |
    A URL shortener with campaign management and click analytics.

    **Authentication** is Google OAuth only. Signing in sets an httpOnly `session`
    cookie holding a JWT; every `/api/urls` endpoint requires it.

    **Status is derived, not stored.** The `status` field in responses is computed
    on every read from the campaign's `starts_at`/`expires_at` and whether the user
    has disabled it. Only `ACTIVE` and `DISABLED` may be *sent* — `scheduled` and
    `expired` are outputs, never inputs. See the `Campaign` schema.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Google OAuth sign-in and session issuance
  - name: Campaigns
    description: Destination URLs and their short-link campaigns
  - name: Analytics
    description: Click analytics for a campaign
  - name: Redirect
    description: Public short-link resolution

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: JWT session cookie set by `GET /api/auth/callback`. Expires after 24h.

  schemas:
    User:
      type: object
      required: [id, email, username, is_verified, created_at, updated_at]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        username:
          type: string
          description: Derived from the email local-part at signup.
        image_url:
          type: [string, "null"]
          description: Google profile picture.
        is_verified:
          type: boolean
        verified_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClickAnalytics:
      type: object
      required: [range, total_clicks]
      properties:
        range:
          type: object
          description: The range actually used, after defaults were applied.
          required: [start_ts, end_ts]
          properties:
            start_ts:
              type: string
              format: date-time
            end_ts:
              type: string
              format: date-time
        total_clicks:
          type: integer
          description: Clicks in the range. Percentages are relative to this.
        group_by:
          type: string
          description: Echoed back; present only on a breakdown.
          enum: [country, city, region, device, browser, os]
        data:
          type: array
          description: Breakdown rows, busiest first. Present only with `group_by`.
          items:
            type: object
            required: [value, clicks, percentage]
            properties:
              value:
                type: string
                description: |
                  The dimension value. Clicks with no value for the dimension
                  are folded into a literal `"unknown"` row rather than dropped
                  — geo is missing for private IPs and OS for unparseable
                  user agents, so this bucket is often significant.
              clicks:
                type: integer
              percentage:
                type: number
                format: double
        total_groups:
          type: integer
          description: |
            Number of distinct values for the dimension in the range - the row
            count, not the click count. Present only on a breakdown; this is
            what page counts are derived from.
        limit:
          type: integer
          description: Rows per page actually applied. Breakdown only.
        offset:
          type: integer
          description: Rows skipped. Breakdown only; present and `0` on page one.
        series:
          type: array
          description: |
            Clicks per time bucket, oldest first. Present only on the overview.
            Hourly for ranges up to 2 days, daily beyond.
          items:
            type: object
            required: [bucket, clicks]
            properties:
              bucket:
                type: string
                format: date-time
              clicks:
                type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable failure reason.
      examples:
        - error: short url not found

    ShortURLStatus:
      type: string
      description: |
        Effective campaign status, computed per request:

        | Value | Meaning |
        |---|---|
        | `disabled` | The user paused it. Always wins over the schedule. |
        | `scheduled` | `starts_at` is in the future. |
        | `expired` | `expires_at` is in the past. |
        | `active` | Redirecting right now. |

        Only `ACTIVE` and `DISABLED` are accepted as *input* on update.
      enum: [active, scheduled, expired, disabled]

    Campaign:
      type: object
      description: A short link and the destination it points at.
      required: [id, code, short_url, campaign_name, status, destination_url, starts_at, expires_at, created_at]
      properties:
        id:
          type: integer
          examples: [9]
        code:
          type: string
          description: The short code appearing in the short link.
          examples: [OQ]
        short_url:
          type: string
          format: uri
          examples: ["http://localhost:8080/OQ"]
        campaign_name:
          type: [string, "null"]
          maxLength: 255
          examples: ["instagram launch"]
        status:
          $ref: '#/components/schemas/ShortURLStatus'
        destination_url:
          type: string
          description: Where visitors are sent.
          examples: ["https://example.com/product/123"]
        starts_at:
          type: [string, "null"]
          format: date-time
          description: Before this instant the campaign reports `scheduled` and will not redirect.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: After this instant the campaign reports `expired` and will not redirect.
        created_at:
          type: string
          format: date-time

    DestinationRef:
      type: object
      required: [id, url]
      properties:
        id:
          type: integer
          examples: [5]
        url:
          type: string
          examples: ["https://example.com/product/123"]

    ShortURLRef:
      type: object
      description: Compact short-link shape returned by the creation endpoints.
      required: [id, code, url, status]
      properties:
        id:
          type: integer
        code:
          type: string
        url:
          type: string
          format: uri
        campaign_name:
          type: [string, "null"]
        status:
          $ref: '#/components/schemas/ShortURLStatus'

    CreateDestinationRequest:
      type: object
      required: [destination_url]
      properties:
        destination_url:
          type: string
          minLength: 1
          description: The long URL to shorten.
        campaign_name:
          type: [string, "null"]
          maxLength: 255
        starts_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
      examples:
        - destination_url: "https://example.com/product/123"
          campaign_name: "instagram launch"

    CreateShortURLRequest:
      type: object
      description: Adds another campaign to a destination that already exists.
      properties:
        campaign_name:
          type: [string, "null"]
          maxLength: 255
        starts_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
      examples:
        - campaign_name: "email campaign"
          expires_at: "2027-01-01T00:00:00Z"

    UpdateCampaignRequest:
      type: object
      description: |
        A partial update. **Omitting a key leaves it unchanged; sending `null`
        clears it.** `{}` is a valid no-op.
      properties:
        name:
          type: [string, "null"]
          maxLength: 255
          description: Send `null` to remove the campaign name.
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          description: |
            Case-insensitive. Sending `SCHEDULED` or `EXPIRED` returns 400 —
            those are derived from the dates, not settable.
        starts_at:
          type: [string, "null"]
          format: date-time
          description: Send `null` to start immediately.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Send `null` to make the campaign never expire.
      examples:
        - name: "renamed campaign"
          status: DISABLED
        - expires_at: null

    CampaignListResponse:
      type: object
      required: [campaigns, total, limit, offset]
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        total:
          type: integer
          description: Total campaigns owned by the user, ignoring pagination.
        limit:
          type: integer
        offset:
          type: integer

  responses:
    Unauthorized:
      description: Missing, expired or invalid session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    NotFound:
      description: |
        No such short code, **or** it belongs to another user. The two are
        deliberately indistinguishable so campaign ownership isn't leaked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: short url not found
    BadRequest:
      description: Malformed body or a patch that would leave the campaign invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: expires_at must be after starts_at

paths:
  /api/health:
    get:
      tags: [Auth]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            text/plain:
              schema:
                type: string
                examples: ["hello world"]

  /api/auth/google/login:
    get:
      tags: [Auth]
      summary: Begin Google sign-in
      security: []
      description: |
        Sets a short-lived `oauth_state` cookie (CSRF protection) and redirects to
        Google's consent screen. Open this in a **browser** — it cannot be completed
        from an API client.
      responses:
        '307':
          description: Redirect to Google's consent screen.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
                examples: ["oauth_state=...; HttpOnly; SameSite=Lax"]
        '500':
          $ref: '#/components/responses/BadRequest'

  /api/auth/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      security: []
      description: |
        Google redirects here with `code` and `state`. On success the user is
        created or refreshed and a `session` JWT cookie is set (24h).

        This URI must exactly match the one registered on the Google OAuth client.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          description: Must match the `oauth_state` cookie.
          schema:
            type: string
        - name: error
          in: query
          description: Present when the user declines consent.
          schema:
            type: string
      responses:
        '302':
          description: |
            Always a redirect, because a browser lands here — never a JSON body.

            On success the `session` cookie is set and the user is sent to
            `FRONTEND_URL`. On failure they are sent to
            `FRONTEND_URL/login?error=<code>`, where the code is one of
            `login_cancelled`, `invalid_state`, `missing_code`, `login_failed`.
          headers:
            Location:
              schema:
                type: string
                examples: ["http://localhost:5173"]
            Set-Cookie:
              description: Present only on success.
              schema:
                type: string
                examples: ["session=<jwt>; HttpOnly; SameSite=Lax"]

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: |
        Lets a SPA bootstrap auth state on load, since the `session` cookie is
        httpOnly and cannot be read by JavaScript. A 401 means "not signed in"
        and should be treated as a normal state, not an error.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      security: []
      description: |
        Clears the `session` cookie. Intentionally unauthenticated, so an
        expired or malformed cookie can still be cleared.
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
                examples: ["session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax"]

  /api/urls:
    get:
      tags: [Campaigns]
      summary: List the authenticated user's campaigns
      description: |
        Newest first. `status` on each row is derived at request time.

        `search` and `status` filter the list server-side, so `total` counts
        only matching campaigns and pagination stays correct.
      parameters:
        - name: search
          in: query
          description: |
            Case-insensitive substring matched against the campaign name, the
            short code and the destination url. Whitespace-only is ignored.
            `%` and `_` are matched literally, not as wildcards.
          schema:
            type: string
            maxLength: 255
          example: uniqlo
        - name: status
          in: query
          description: |
            Filters on the **derived** status, so `scheduled` and `expired`
            work even though neither is ever stored.
          schema:
            $ref: '#/components/schemas/ShortURLStatus'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: The user's campaigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
        '400':
          description: |
            `status` was not one of the four allowed values. Invalid `limit`,
            `offset` and `search` values fall back instead of erroring.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: status must be one of active, scheduled, expired, disabled
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Campaigns]
      summary: Shorten a URL (find-or-create the destination)
      description: |
        Two outcomes:

        - **201** — the destination is new for this user, so it is created along
          with a first campaign, returned as `short_url`.
        - **200** — the user already has this destination, so nothing is created
          and its existing campaigns are returned as `short_urls`. Any
          `campaign_name`/`starts_at`/`expires_at` sent are ignored in this case;
          use `POST /api/destinations/{destinationId}/short-urls` to add another campaign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDestinationRequest'
      responses:
        '201':
          description: Destination created with its first campaign.
          content:
            application/json:
              schema:
                type: object
                required: [destination_url, short_url]
                properties:
                  destination_url:
                    $ref: '#/components/schemas/DestinationRef'
                  short_url:
                    $ref: '#/components/schemas/ShortURLRef'
        '200':
          description: Destination already existed; its campaigns are returned.
          content:
            application/json:
              schema:
                type: object
                required: [destination_url, short_urls]
                properties:
                  destination_url:
                    $ref: '#/components/schemas/DestinationRef'
                  short_urls:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShortURLRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/urls/{shortCode}:
    parameters:
      - name: shortCode
        in: path
        required: true
        schema:
          type: string
        examples:
          simple:
            value: OQ
    get:
      tags: [Campaigns]
      summary: Fetch a single campaign
      responses:
        '200':
          description: The campaign.
          content:
            application/json:
              schema:
                type: object
                required: [campaign]
                properties:
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Campaigns]
      summary: Update a campaign
      description: |
        Partial update of `name`, `status`, `starts_at`, `expires_at`.

        Validation runs against the **resulting** state, so a single request may
        both re-enable a campaign and extend its `expires_at`. Enabling a campaign
        whose `expires_at` is already past succeeds but reports `expired`.

        A successful update refreshes the redirect cache immediately, so disabling
        a campaign stops it redirecting at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: The updated campaign.
          content:
            application/json:
              schema:
                type: object
                required: [campaign]
                properties:
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/urls/{shortCode}/clicks:
    get:
      tags: [Analytics]
      summary: Click analytics for a campaign
      description: |
        Two response shapes, selected by whether `group_by` is present:

        - **without `group_by`** — the overview: `total_clicks` plus a bucketed
          `series` for the trend line.
        - **with `group_by`** — a breakdown: `total_clicks` plus `data`, the top
          values for that dimension.

        The series is deliberately only returned for the overview, so switching
        dimensions doesn't recompute a trend the page already has.

        **Range**: defaults to the last **7 days**; maximum window is **90 days**
        (a larger request is rejected rather than silently truncated). Bucket
        granularity follows the window — hourly for ranges of 2 days or less,
        daily beyond that.

        **Percentages** are relative to `total_clicks`. Rows are capped at
        `limit`, so the listed rows may legitimately sum to less than 100%.
      parameters:
        - name: shortCode
          in: path
          required: true
          schema:
            type: string
        - name: group_by
          in: query
          required: false
          description: Omit for the overview.
          schema:
            type: string
            enum: [country, city, region, device, browser, os]
        - name: start_ts
          in: query
          required: false
          description: RFC3339. Defaults to `end_ts` minus 7 days.
          schema:
            type: string
            format: date-time
        - name: end_ts
          in: query
          required: false
          description: RFC3339. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Breakdown rows per page, busiest first. Ignored for the overview.
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        - name: offset
          in: query
          required: false
          description: |
            Rows to skip, for paging a breakdown. Ignored for the overview.
            Use `offset = limit * (page - 1)`; page count comes from
            `total_groups`, **not** from `total_clicks` (that counts clicks,
            not rows).
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Overview or breakdown, depending on `group_by`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClickAnalytics'
              examples:
                overview:
                  summary: No group_by - totals and trend
                  value:
                    range:
                      start_ts: "2026-08-30T18:59:13Z"
                      end_ts: "2026-09-06T18:59:13Z"
                    total_clicks: 35656
                    series:
                      - bucket: "2026-08-31T00:00:00Z"
                        clicks: 5027
                      - bucket: "2026-09-01T00:00:00Z"
                        clicks: 5090
                breakdown:
                  summary: group_by=country
                  value:
                    range:
                      start_ts: "2026-08-30T18:59:13Z"
                      end_ts: "2026-09-06T18:59:13Z"
                    group_by: country
                    total_clicks: 35655
                    data:
                      - value: "IN"
                        clicks: 6044
                        percentage: 16.95
                      - value: "unknown"
                        clicks: 20
                        percentage: 0.06
        '400':
          description: |
            Unknown `group_by`, unparseable timestamp, `start_ts` not before
            `end_ts`, or a window longer than 90 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/destinations/{destinationId}/short-urls:
    post:
      tags: [Campaigns]
      summary: Add another campaign to an existing destination
      description: |
        Lets one destination carry several short links — e.g. one per marketing
        channel — each with its own code, name and schedule.

        Keyed by **destination id**. Campaign endpoints live under `/api/urls`
        and are keyed by short code, so the two identifier types stay separate.
      parameters:
        - name: destinationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShortURLRequest'
      responses:
        '201':
          description: The new campaign.
          content:
            application/json:
              schema:
                type: object
                required: [short_url]
                properties:
                  short_url:
                    $ref: '#/components/schemas/ShortURLRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such destination, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /{shortCode}:
    get:
      tags: [Redirect]
      summary: Resolve a short link
      security: []
      description: |
        Public, unauthenticated. Served from a Redis cache without touching the
        database on a hit. Records a click event asynchronously — analytics never
        delay or break the redirect.

        Returns **302** (not 301) deliberately: a cached permanent redirect would
        stop repeat clicks reaching the server, losing analytics.
      parameters:
        - name: shortCode
          in: path
          required: true
          schema:
            type: string
        - name: X-Forwarded-For
          in: header
          required: false
          description: First entry is used as the client IP for geo lookup when present.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the destination URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: |
            Unknown code, or the campaign is `disabled`, `scheduled` or `expired`.
            Indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
